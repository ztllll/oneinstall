name: Build Windows EXE

# "on" 必须加引号, PyYAML 1.1 会把 on/off 当 bool
"on":
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-windows-exe
  cancel-in-progress: false

jobs:
  build:
    name: Build OneInstall.exe
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller `
            --onefile `
            --noconsole `
            --name OneInstall `
            --distpath dist `
            --workpath build `
            --clean `
            --noconfirm `
            --hidden-import=pywinauto `
            --hidden-import=pywinauto.findwindows `
            --hidden-import=PIL `
            --add-data "configs;configs" `
            main.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (Test-Path dist/OneInstall.exe) {
            $size = (Get-Item dist/OneInstall.exe).Length
            Write-Host "✓ Size: $([math]::Round($size/1MB, 2)) MB"
            # smoke test
            cd dist
            .\OneInstall.exe --list-configs
          } else {
            Write-Error "✗ EXE not found"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: OneInstall-windows
          path: |
            dist/OneInstall.exe
            configs/
          if-no-files-found: error
          retention-days: 30

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OneInstall.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
