# OneInstall - Inno Setup 专用配置
# 用于典型的 Inno Setup 5/6 安装程序
# 静默参数: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
# GUI 特征: 标题通常为 "<AppName> Setup", 按钮为标准 Win32

silent_args:
  - /VERYSILENT
  - /SUPPRESSMSGBOXES
  - /NORESTART
  - /S
  - /silent

installer_type: inno_setup

# Inno Setup 按钮顺序通常是: Next -> (协议) -> Install -> Finish
wizard_buttons:
  - names: [我接受, I accept, 我同意, I Agree, &I accept the agreement]
    action: check
    control_type: CheckBox

  - names: [下一步, Next, &Next, Next >]
    action: click
    control_type: Button

  - names: [安装, Install, &Install, Install >]
    action: click
    control_type: Button

  - names: [完成, Finish, &Finish, Finish >, Close]
    action: click
    control_type: Button
    is_done: true

skip_on_error: true
timeout: 600
step_timeout: 30
screenshot_dir: screenshots
debug_screenshot: false
